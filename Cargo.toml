[package]
name = "solana-event-trader"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

[dependencies]
anyhow = "=1.0.100"
base64 = "=0.22.1"
bincode = "=1.3.3"
env_logger = "=0.11.8"
futures-util = { version = "=0.3.31", features = ["sink"] }
log = "=0.4.28"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["raw_value"] }
solana-client = "=2.3.13"
solana-sdk = "=2.3.1"
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync", "fs", "io-util"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "=0.9.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
